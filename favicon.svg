<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Slate Background with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Subtle Emerald Inner Glow / Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#059669" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- GCC Geographic Shield Vector -->
  <path d="M32 10C42 10 50 14 50 25C50 39 32 52 32 52C32 52 14 39 14 25C14 14 22 10 32 10Z" fill="#1e293b" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Minimalist Financial / Calculation Glyph (Plus, Slash, Equal, Chevron) -->
  <!-- Upper Left: Plus '+' -->
  <path d="M24 22V28M21 25H27" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Upper Right: Multiplication / Percent '%' -->
  <circle cx="39" cy="22" r="1.5" fill="#34d399"/>
  <circle cx="43" cy="28" r="1.5" fill="#34d399"/>
  <line x1="43" y1="22" x2="39" y2="28" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Center Chevron Upward Trend -->
  <path d="M24 38L32 32L40 38" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom: Equals '=' -->
  <line x1="26" y1="42" x2="38" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="45" x2="38" y2="45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
